name: smoke

# Azure 호출 없이 의존성 정합성·구문·모듈 임포트를 확인하는 스모크 테스트입니다.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install console dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Byte-compile console scripts
        run: python -m py_compile src/*.py

      - name: Import console modules
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from importlib.util import module_from_spec, spec_from_file_location
          from pathlib import Path

          for index, path in enumerate(sorted(Path("src").glob("*.py"))):
              spec = spec_from_file_location(f"smoke_{index}", path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"모듈 로더를 만들 수 없습니다: {path}")
              module = module_from_spec(spec)
              spec.loader.exec_module(module)

          print("모든 콘솔 모듈 임포트 성공")
          PY

  hosted:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01_single_agent
          - 02_sequential_workflow
          - 03_group_chat
          - 04_concurrent_workflow
          - 05_mcp_agent
          - 06_rag_agent
          - 06_rag_agent_foundry_iq
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
          cache: pip
          cache-dependency-path: src/hosted_agents/${{ matrix.example }}/requirements.txt

      - name: Install Hosted Agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "src/hosted_agents/${{ matrix.example }}/requirements.txt"
          python -m pip check

      - name: Byte-compile Hosted Agent
        run: python -m py_compile "src/hosted_agents/${{ matrix.example }}/main.py"

      - name: Import Hosted Agent module
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          python - <<'PY'
          import os
          from importlib.util import module_from_spec, spec_from_file_location
          from pathlib import Path

          path = Path("src/hosted_agents") / os.environ["EXAMPLE"] / "main.py"
          spec = spec_from_file_location("hosted_smoke", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"모듈 로더를 만들 수 없습니다: {path}")
          module = module_from_spec(spec)
          spec.loader.exec_module(module)

          print(f"Hosted Agent 모듈 임포트 성공: {path}")
          PY
