# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.5'
name: maf-lab-sequential-workflow
services:
  ai-project:
    host: azure.ai.project
  maf-lab-sequential-workflow:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_14
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: maf-lab-sequential-workflow
    description: 순차 워크플로우를 호스팅하는 Agent Framework 실습입니다.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
